# TaskTick — single-container deployment (SQLite on a named volume).
#
#   docker compose up -d
#
# That is the whole setup. There is no .env file to create:
#   * BETTER_AUTH_SECRET is generated by the container on first boot and stored
#     in the data volume (see scripts/docker-entrypoint.sh);
#   * every value below has a working default.
#
# To override anything, either export it in your shell or create a .env file —
# both are picked up automatically. See .env.example for the full list.
#
# Postgres instead of SQLite:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# No `version:` key: Compose v2 ignores it.

services:
  tasktick:
    # Published multi-arch image (linux/amd64 + linux/arm64) from GitHub Actions.
    # Public, so no `docker login ghcr.io` is needed to pull it.
    image: ghcr.io/ksmarty/tasktick:latest
    # Prefer building from this checkout instead of pulling? Comment `image:`
    # above and uncomment next line.
    # build: .

    # NOTE: no `env_file:` on purpose.
    #
    # Compose already reads a `.env` sitting next to this file and uses it to
    # interpolate ${VAR:-default} below, so a separate env_file directive adds
    # nothing except a hard dependency on Compose v2.24+ (where `required: false`
    # was introduced) — an older Compose would refuse to parse this file at all.
    # Every variable the app understands is listed explicitly instead, which also
    # makes it obvious what the container actually receives.
    #
    # Precedence: a value exported in your shell beats .env, which beats the
    # defaults here.
    environment:
      # Fixed inside the container; the host port is `${PORT}` below.
      PORT: "3000"

      # The public origin, used for OIDC redirect URIs and the webcal://
      # subscription links shown in Settings. Optional for reaching the app — a
      # private-network origin is always accepted — but set it so subscription
      # links point at an address your phone can reach.
      APP_URL: ${APP_URL:-http://localhost:3000}

      # Extra origins allowed to make state-changing auth requests. Needed only
      # for a PUBLIC hostname behind a reverse proxy; LAN access is automatic.
      #   BETTER_AUTH_TRUSTED_ORIGINS: "https://tasks.example.com"
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}

      # Leave blank to have the container generate and persist one on first boot.
      # Set it only when migrating an existing deployment.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}

      # open | invite | closed. The first account always becomes the
      # administrator regardless of this setting.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}

      DATABASE_URL: ${DATABASE_URL:-file:/data/tasktick.db}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      DEFAULT_TIME_FORMAT: ${DEFAULT_TIME_FORMAT:-24h}
      DEFAULT_WEEK_START: ${DEFAULT_WEEK_START:-1}

      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_TICK_SECONDS: ${SYNC_TICK_SECONDS:-60}
      SYNC_MAX_ITEMS_PER_RUN: ${SYNC_MAX_ITEMS_PER_RUN:-2000}
      CALDAV_ALLOW_INSECURE_TLS: ${CALDAV_ALLOW_INSECURE_TLS:-false}

      # Set true when this sits behind a reverse proxy you control.
      TRUST_PROXY: ${TRUST_PROXY:-false}

      # Optional single sign-on. Redirect URI to register with your provider:
      #   ${APP_URL}/api/auth/oauth2/callback/oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}

      # Optional Web Push. Setting VAPID_PUBLIC_KEY enables it; the browser is
      # handed the public key at runtime, so no NEXT_PUBLIC_* build variable is
      # involved. Generate a pair with: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}

    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Holds the SQLite database AND the auto-generated auth secret, so this
      # volume is the only thing that needs backing up.
      - tasktick-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # No `healthcheck:` here on purpose. The image declares its own HEALTHCHECK
    # against /healthz (see the Dockerfile), and Compose inherits it. Defining
    # one here as well would mean two places to keep in sync.

volumes:
  tasktick-data:

# --- Reverse proxy / TLS ---------------------------------------------------
# TaskTick is an installable iOS PWA with Web Push, and both require a secure
# context: without HTTPS the browser silently refuses to register the service
# worker and push subscriptions. Put a TLS terminator in front and keep this
# container's port on the loopback interface, e.g.
#
#   caddy reverse-proxy --from tasks.example.com --to 127.0.0.1:3000
#
# ...or nginx/Traefik with the usual X-Forwarded-* headers. Then set
# APP_URL=https://tasks.example.com and TRUST_PROXY=true, and publish the port
# only locally (ports: ["127.0.0.1:${PORT:-3000}:3000"]).
