# Service UI descriptions for TaskTick.
#
# These drive the form in Developer Tools → Actions and the automation
# "Perform action" editor. The voluptuous schemas in services.py still validate
# every call; this file is presentation.
#
# `list`, `calendar` and `habit` accept **either an id or a name** — the name is
# what a person writes in an automation, and the id is what the todo and
# calendar entities carry.

create_task:
  name: Create task
  description: Create a task and return it.
  fields:
    title:
      required: true
      example: Take out the trash
      selector:
        text: {}
    list:
      example: Inbox
      selector:
        text: {}
    notes:
      example: The bins go out tonight
      selector:
        text:
          multiline: true
    due:
      example: "2026-03-04 17:00"
      selector:
        text: {}
    priority:
      default: none
      selector:
        select:
          options:
            - none
            - low
            - medium
            - high
    tags:
      example: errands
      selector:
        text:
          multiple: true
    calendar:
      example: Personal
      selector:
        text: {}

update_task:
  name: Update task
  description: Change a task's fields. Only the fields given are changed.
  fields:
    task_id:
      required: true
      selector:
        text: {}
    title:
      selector:
        text: {}
    list:
      selector:
        text: {}
    notes:
      selector:
        text:
          multiline: true
    due:
      description: A new due date, or empty to clear it.
      selector:
        text: {}
    priority:
      selector:
        select:
          options:
            - none
            - low
            - medium
            - high
    tags:
      selector:
        text:
          multiple: true
    calendar:
      selector:
        text: {}

complete_task:
  name: Complete task
  description: Mark a task complete. A repeating task rolls to its next occurrence.
  fields:
    task_id:
      required: true
      selector:
        text: {}

delete_task:
  name: Delete task
  fields:
    task_id:
      required: true
      selector:
        text: {}

check_in_habit:
  name: Check in to a habit
  description: >-
    Record a check-in. Use `delta` to add to today's count and `count` to set
    it; `date` backdates the check-in.
  fields:
    habit:
      required: true
      example: Go for a run
      selector:
        text: {}
    count:
      description: Set today's count to this value.
      selector:
        number:
          min: 0
          mode: box
    delta:
      description: Add this to today's count.
      selector:
        number:
          mode: box
    date:
      description: The day to check in for. Defaults to today.
      selector:
        date: {}

create_event:
  name: Create event
  description: Create a calendar event and return it.
  fields:
    calendar:
      description: >-
        Name or id of the calendar to write to. Leave it out for the default
        calendar chosen in the integration options, or TaskTick's own default.
      example: Personal
      selector:
        text: {}
    summary:
      required: true
      example: Dentist
      selector:
        text: {}
    start:
      example: "2026-03-04 09:00"
      selector:
        text: {}
    end:
      example: "2026-03-04 09:30"
      selector:
        text: {}
    all_day:
      default: false
      selector:
        boolean: {}
    description:
      selector:
        text:
          multiline: true
    location:
      selector:
        text: {}
    rrule:
      description: An RRULE string, e.g. FREQ=WEEKLY;BYDAY=MO
      selector:
        text: {}
    reminders:
      description: Reminder offsets in minutes before the start.
      selector:
        number:
          multiple: true
          min: 0
          mode: box

update_event:
  name: Update event
  description: Change an event's fields. Only the fields given are changed.
  fields:
    event_id:
      required: true
      selector:
        text: {}
    calendar:
      selector:
        text: {}
    summary:
      selector:
        text: {}
    start:
      selector:
        text: {}
    end:
      selector:
        text: {}
    all_day:
      selector:
        boolean: {}
    description:
      selector:
        text:
          multiline: true
    location:
      selector:
        text: {}
    rrule:
      selector:
        text: {}
    reminders:
      selector:
        number:
          multiple: true
          min: 0
          mode: box

delete_event:
  name: Delete event
  fields:
    event_id:
      required: true
      selector:
        text: {}

create_reminder:
  name: Create reminder
  description: >-
    Create an HA Reminders reminder for a task, a habit or a calendar event.
    Tapping the notification opens TaskTick at that task, habit or day, and its
    acknowledge button completes the task or checks the habit in. Needs the HA
    Reminders integration (a HACS install) to deliver anything.
  fields:
    title:
      description: >-
        What the notification says. A task or a habit supplies its own name, so
        this is only needed for an event, which TaskTick cannot look up.
      example: Take out the trash
      selector:
        text: {}
    message:
      example: The bins go out tonight
      selector:
        text:
          multiline: true
    task_id:
      description: The task to remind you about. Give one of task_id, habit or event_id.
      selector:
        text: {}
    habit:
      description: A habit, by id or by name.
      example: Go for a run
      selector:
        text: {}
    event_id:
      description: A calendar event. Give `date` as well, since TaskTick cannot look the event up.
      selector:
        text: {}
    date:
      description: The day the notification opens on. Defaults to today.
      selector:
        date: {}
    complete:
      description: >-
        The acknowledge button that completes the task or checks the habit in.
        An event gets no button either way, because there is nothing to finish.
      default: true
      selector:
        boolean: {}
    acknowledge_action_title:
      description: What that button says — Complete, or Check in.
      selector:
        text: {}
    icon:
      description: "An mdi: icon name, or a URL to an image. TaskTick's own icon by default."
      selector:
        text: {}
    notify_service:
      description: >-
        The notify service to send through, e.g. notify.mobile_app_phone. Empty
        uses the one HA Reminders is configured with.
      selector:
        text: {}
    user_name:
      description: The name the reminder is addressed to.
      selector:
        text: {}
    trigger_type:
      description: What fires the reminder.
      default: time
      selector:
        select:
          options:
            - time
            - zone_enter
            - zone_leave
    time:
      description: When to send it. Required by a time trigger.
      selector:
        time: {}
    start_date:
      description: The first day it may fire. Defaults to today.
      selector:
        date: {}
    stop_date:
      description: The last day it may fire. Empty repeats for ever.
      selector:
        date: {}
    every_x_days:
      description: Repeat every N days.
      selector:
        number:
          min: 1
          mode: box
    exclude_days_of_week:
      description: Days of the week to skip, as 0 (Monday) to 6 (Sunday).
      selector:
        select:
          multiple: true
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
    zone_entity_id:
      description: The zone to watch. Required by a zone trigger.
      selector:
        entity:
          domain: zone
    person_entity_ids:
      description: The people whose arrival or departure fires it.
      selector:
        entity:
          domain: person
          multiple: true
    time_window_start:
      description: Only send it after this time of day.
      selector:
        time: {}
    time_window_end:
      description: And not after this one.
      selector:
        time: {}
    snooze_delays:
      description: Snooze lengths in minutes, one button each.
      selector:
        number:
          multiple: true
          min: 1
          mode: box
    snooze_text:
      description: What those buttons say, e.g. Snooze for {minutes}m.
      selector:
        text: {}
    notification_group:
      description: >-
        Notifications sharing a group replace one another, and acknowledging one
        tells the group.
      selector:
        text: {}
    enabled:
      default: true
      selector:
        boolean: {}
    one_shot:
      description: Stop after the first acknowledge.
      default: true
      selector:
        boolean: {}
    wait_time_if_no_action:
      description: Minutes to wait before re-sending a reminder nobody answered.
      selector:
        number:
          min: 1
          mode: box
    notification_count:
      description: How many times to re-send it before giving up.
      selector:
        number:
          min: 1
          mode: box

install_sentences:
  name: Install Assist sentences
  description: >-
    Copy the TaskTick sentence templates into custom_sentences/ so Assist can
    understand "add a task to my shopping list". Home Assistant only loads
    custom sentences from the config directory, so this has to be run once (and
    again after an update that changes them). Reloads the conversation agent.
  fields:
    language:
      default: en
      selector:
        text: {}

assist_tools:
  name: List the tools the voice assistant is given
  description: >-
    Answer with every tool Home Assistant offers a conversation agent, including
    the TaskTick intents. An agent can only call what is on this list, so run
    this when the assistant says it cannot do something TaskTick can do: a
    missing TaskTick tool means the integration is not set up or the agent has
    "Control Home Assistant" turned off, while a present tool that is never
    chosen is a prompt problem.
