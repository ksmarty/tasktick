# Overlay: adds a Postgres 17 service and points TaskTick at it.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# No .env file is required — POSTGRES_PASSWORD defaults below, and the app's
# BETTER_AUTH_SECRET is still generated by the entrypoint on first boot.
#
# The password is *not* overridden on the app side: both services read the same
# ${POSTGRES_PASSWORD:-tasktick} default, so they always agree. If you set it,
# set it in one place (shell or .env) and both pick it up.
#
# Postgres migrations are generated with:
#   npx drizzle-kit generate --config drizzle.pg.config.ts

services:
  tasktick:
    environment:
      DATABASE_URL: "postgres://tasktick:${POSTGRES_PASSWORD:-tasktick}@db:5432/tasktick"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasktick
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tasktick}"
      POSTGRES_DB: tasktick
    volumes:
      - tasktick-postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    # Kept here rather than inherited from the image: this healthcheck is about
    # Postgres being ready, and is what the app's `depends_on` waits for. (The
    # app service deliberately declares none — its image provides one.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktick -d tasktick"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  tasktick-postgres:
