name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.43.0 (optional; adds 0.43.0 and 0.43)
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    # A multi-arch build of this app should take single-digit minutes now that
    # the compile runs once on the build platform instead of under QEMU. Anything
    # approaching this cap means something is wrong, so fail loudly rather than
    # burning an hour of runner time.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io rejects any uppercase character in the repository path, so
      # lowercase ${{ github.repository }} before it is used as an image name.
      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push event derives its tags from the ref, which is why a tag push
      # publishes 0.43.0 and 0.43. `auto-increment.yml` cannot push a tag that
      # triggers this workflow — a push made with GITHUB_TOKEN starts no runs at
      # all — so it dispatches this workflow instead, and a dispatch has no
      # version-bearing ref to read. Derive the two semver tags from the input so
      # a dispatched run publishes the same tags a tag push would.
      - name: Derive the semver tags from the dispatched version
        id: semver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          IFS=. read -r MAJOR MINOR _REST <<< "$VERSION"
          echo "exact=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.exact }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=${{ steps.semver.outputs.minor }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=TaskTick
            org.opencontainers.image.description=Self-hosted task manager, calendar and habit tracker with bidirectional CalDAV sync.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
