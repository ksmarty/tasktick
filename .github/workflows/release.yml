name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-release an existing tag without deleting it. Useful when the tag
  # annotation was corrected, or when a release needs regenerating.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so the tag object and its annotation are present.
          fetch-depth: 0

      # The release body comes from the annotated tag message, not from
      # `generate_release_notes`.
      #
      # GitHub's generated notes are assembled from merged pull requests, so a
      # repository that commits straight to main produces a release containing
      # nothing but a "Full Changelog" link — which is exactly what v0.1.0 did.
      # The tag annotation is written by a human at release time and is the
      # better source. `body_path` is used instead of letting the API generate
      # the notes, because supplying both lets the server-side generation
      # overwrite the curated text.
      - name: Build release body from the annotated tag
        id: notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A workflow_dispatch run may not have the tag locally yet.
          git fetch --tags --force

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist."
            exit 1
          fi

          git tag -l --format='%(contents)' "$TAG" > /tmp/tag-message.md

          if [ ! -s /tmp/tag-message.md ]; then
            echo "::warning::Tag ${TAG} is lightweight with no annotation; falling back."
            printf 'Release %s. See the commit history for details.\n' "$TAG" > /tmp/tag-message.md
          fi

          {
            cat /tmp/tag-message.md
            printf '\n---\n\n**Full Changelog**: https://github.com/%s/commits/%s\n' "$REPOSITORY" "$TAG"
          } > /tmp/release-body.md

          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"
          echo "Release body is $(wc -c < /tmp/release-body.md) bytes"

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          # Off on purpose: the curated annotation IS the body. Leaving this on
          # would let GitHub regenerate (and overwrite) it server-side.
          generate_release_notes: false
          draft: false
          prerelease: false
