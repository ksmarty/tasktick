name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR branch, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # src/lib/env.ts throws at import time in production when this is missing.
      # CI only needs a valid-shaped dummy — never a real secret.
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-outside-ci-000000
      DATABASE_URL: file:./ci.db
    steps:
      # Full history, not the default single commit: `verify:sw` compares the
      # current `VERSION` against the previous tag, and with one commit of
      # history there is no previous tag — the script then exits 0 with
      # "nothing to compare", which is why three releases shipped a
      # byte-identical worker while CI reported success.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify service worker version
        run: npm run verify:sw

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # No artifact upload.
      #
      # This step used to ship .next/standalone and .next/static (66 MB, retained
      # 7 days). Nothing consumes it: the image workflow builds from source in its
      # own job, and no other workflow downloads it. `npm run build` no longer
      # produces standalone output at all — only the Docker build asks for it — so
      # the upload would now find nothing anyway.

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # The *newest* Home Assistant, deliberately. The oldest supported release
      # is declared in hacs.json and cannot be installed on a current Python at
      # all, so it can only be exercised by hand. The tests read that same
      # hacs.json and skip the Home Assistant-dependent modules below it, so a
      # mismatch shows up as a skip rather than a confusing TypeError.
      #
      # `hassil` and `home-assistant-intents` are component requirements, which pip
      # does not install alongside Home Assistant itself. They are installed by
      # `install_ha_test_deps.py` at the versions this Home Assistant pins — the
      # newest `hassil` is a pre-release, so an unpinned install silently resolves
      # to an older one and the conversation component then fails to import.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml homeassistant
          python integrations/home-assistant/scripts/install_ha_test_deps.py

      - name: Test
        working-directory: integrations/home-assistant
        run: python -m pytest tests/ -q

      # Built here as well as in the release workflow, so a broken archive layout
      # fails on the pull request that broke it rather than at release time.
      - name: Build the HACS archive
        run: python integrations/home-assistant/scripts/build_zip.py
