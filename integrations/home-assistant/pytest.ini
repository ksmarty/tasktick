[pytest]
testpaths = tests
addopts = -q
# `custom_components.tasktick` has to be importable from the tests, and pytest
# does not add the rootdir on its own. The package sits in the repository root —
# HACS only accepts an integration at ROOT/custom_components/<domain>/ — so the
# path climbs out of this directory to reach it.
pythonpath = ../..
